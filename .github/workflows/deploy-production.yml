name: Trigger auto deployment for fifoo-game-api-prod

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/fifoo-game-api-prod-AutoDeployTrigger-2a3a3218-7918-4ae0-8adc-2f08f0be3494.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FIFOOGAMEAPIPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FIFOOGAMEAPIPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FIFOOGAMEAPIPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        name: Deploy Fifoo backend production

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "sql/**"
      - "scripts/**"
      - "package.json"
      - "Dockerfile"
      - ".github/workflows/deploy-production.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: fifoo-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run check

      - name: Tests
        run: npm test

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FIFOOGAMEAPIPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FIFOOGAMEAPIPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FIFOOGAMEAPIPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile

          acrName: fifooprodregistry01
          acrUsername: ${{ secrets.FIFOOGAMEAPIPROD_REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.FIFOOGAMEAPIPROD_REGISTRY_PASSWORD }}

          imageToBuild: fifooprodregistry01.azurecr.io/fifoo-game-api-prod:${{ github.sha }}

          containerAppName: fifoo-game-api-prod
          resourceGroup: fifoo-production

          targetPort: 3000
          ingress: external
          disableTelemetry: true

      - name: Verify production readiness
        env:
          API_BASE_URL: https://api.fifoo.ai
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            code="$(
              curl \
                --silent \
                --show-error \
                --output /tmp/ready.out \
                --write-out '%{http_code}' \
                "$API_BASE_URL/ready" \
                || true
            )"

            if [ "$code" = "204" ]; then
              echo "Production backend is ready."
              exit 0
            fi

            echo "Readiness attempt $attempt returned HTTP $code."
            sleep 10
          done

          cat /tmp/ready.out || true
          exit 1
