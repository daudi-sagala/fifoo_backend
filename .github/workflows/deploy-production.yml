name: Deploy Fifoo backend production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sql/**'
      - 'package.json'
      - '.github/workflows/deploy-production.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: fifoo-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run check

      - name: Tests
        
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fifoo_test
        run: npm test

      - name: Azure login with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .

      - name: Verify readiness
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.out --write-out '%{http_code}' "$API_BASE_URL/ready" || true)"
            if [ "$code" = "204" ]; then
              echo "Production backend is ready."
              exit 0
            fi
            sleep 10
          done
          cat /tmp/ready.out || true
          exit 1
